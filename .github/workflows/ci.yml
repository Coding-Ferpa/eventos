name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

# O doc 12 descreve o CI completo. Os jobs chegam junto com o que eles
# verificam: job que roda contra diretório vazio passa por vacuidade e dá
# falsa segurança.
#
# Nenhum job usa secret: tudo fala com o ambiente local, então PR de fork roda
# a bateria inteira.
jobs:
  quality:
    name: Lint, tipos e formatação
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - name: .env.example em sincronia com o schema de env
        run: pnpm check:env
      # Compatibilidade com o deploy anterior. No PR, para a conversa acontecer
      # na revisão e não no dia do deploy.
      - name: Expand/contract nas migrations
        run: pnpm check:migrations
      # A Preview da Vercel sobe sem banco e sem Supabase (doc 02). Este job
      # também não tem nenhum dos dois, então o build daqui é o da Preview: se
      # alguma página passar a exigir o banco no build, quebra aqui, e não no
      # primeiro deploy de Preview depois do merge.
      - name: Build como Preview, sem banco
        run: pnpm build
        env:
          NEXT_PUBLIC_SITE_URL: https://preview.example.org
      # Entra aqui: check:fonts no M5.
      #
      # Bloqueia no que vai para produção (doc 08, A06). Avisos em dependência
      # de desenvolvimento aparecem no passo seguinte sem derrubar o PR.
      - name: Auditoria de dependências de produção
        run: pnpm audit --prod --audit-level high
      - name: Auditoria completa (informativa)
        continue-on-error: true
        run: pnpm audit --audit-level high

  commitlint:
    name: Conventional Commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Valida as mensagens de commit do PR
        run: >
          pnpm commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose

  test:
    name: Testes unitários
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Os dois gates inegociáveis do doc 12 entram aqui como passos
      # nomeados: test:gate:pdf no M5 e test:gate:csv no M7. PR que os
      # remova, marque com .skip ou afrouxe é recusado.
      - run: pnpm test:coverage

  db:
    name: Banco de dados
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Sobe o Supabase local
        run: pnpm db:start
      - name: Aplica as migrations do zero e os dois seeds
        run: pnpm db:reset
      - name: Matriz de RLS, funções e guardas (pgTAP)
        run: pnpm db:test
      # O endereço sai do próprio Supabase, e não de uma porta escrita aqui:
      # este projeto usa portas deslocadas para conviver com o CF Jobs.
      - name: Schema Drizzle em sincronia com o banco
        run: |
          eval "$(pnpm exec supabase status -o env | grep -E '^DB_URL=' | sed 's/^/export /')"
          DATABASE_URL="$DB_URL" pnpm check:schema
      # Entra aqui: test:integration no M7, com a importação.
      - name: Derruba o Supabase
        if: ${{ always() }}
        run: pnpm db:stop

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # O orçamento é medido contra a área pública com os eventos do seed.
      - name: Sobe o Supabase local
        run: pnpm db:start
      - name: Aponta o app para o Supabase local
        run: |
          # O comando também imprime linhas de status; só as VARIAVEL="valor" servem.
          eval "$(pnpm exec supabase status -o env | grep -E '^[A-Z_]+=' | sed 's/^/export /')"
          {
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000"
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "DATABASE_URL=$DB_URL"
            echo "DEVICE_COOKIE_SECRET=desenvolvimento-local-cookie-de-dispositivo-cf-eventos"
            echo "IP_HASH_SECRET=desenvolvimento-local-hash-diario-de-ip-e-dispositivo"
          } >> "$GITHUB_ENV"
      - run: pnpm build
      # LCP, CLS e TBT são a asserção principal; os KB de JavaScript são o
      # tripwire de regressão (ADR-0015). O lhci sobe o `pnpm start` sozinho.
      - name: Orçamento de performance do doc 09
        run: pnpm exec lhci autorun
      - name: Derruba o Supabase
        if: ${{ always() }}
        run: pnpm db:stop
      # Os relatórios ficam como artefato do job, sem armazenamento público.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: lighthouse
          path: .lighthouseci/
          retention-days: 7

  e2e:
    name: Testes E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Chromium para o desktop e o celular Android; WebKit para o iPhone, que
      # roda os fluxos de `e2e/publico/` (doc 11).
      - name: Instala o Chromium e o WebKit do Playwright
        run: pnpm exec playwright install --with-deps chromium webkit
      # Login, papéis e o guarda do admin precisam de banco e de auth de
      # verdade. O `start` de um banco novo já aplica migrations e seeds.
      - name: Sobe o Supabase local
        run: pnpm db:start
      - name: Aponta o app para o Supabase local
        run: |
          # O comando também imprime linhas de status; só as VARIAVEL="valor" servem.
          eval "$(pnpm exec supabase status -o env | grep -E '^[A-Z_]+=' | sed 's/^/export /')"
          {
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000"
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "DATABASE_URL=$DB_URL"
            # Os valores de desenvolvimento do .env.example: públicos de
            # propósito, e recusados pelo schema dentro da Vercel.
            echo "DEVICE_COOKIE_SECRET=desenvolvimento-local-cookie-de-dispositivo-cf-eventos"
            echo "IP_HASH_SECRET=desenvolvimento-local-hash-diario-de-ip-e-dispositivo"
          } >> "$GITHUB_ENV"
      # O build roda pelo `webServer` do playwright.config.ts.
      - run: pnpm test:e2e
      - name: Derruba o Supabase
        if: ${{ always() }}
        run: pnpm db:stop
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
